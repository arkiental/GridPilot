name: Build and core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows build and core tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build GridPilot.sln -c Release -warnaserror
      - name: Core tests
        run: dotnet run --project tests/GridPilot.Tests -c Release --no-build -- --core
      # Hosted CI has no reliable interactive Windows desktop. Native fixture tests run locally.
      - name: Publish portable build
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GridPilot-win-x64
          path: artifacts/GridPilot-win-x64/
          if-no-files-found: error
          retention-days: 14
